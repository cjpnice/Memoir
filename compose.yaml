services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      PORT: 8090
      DATA_DIR: /data
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-256}
      MAX_UPLOAD_FILES: ${MAX_UPLOAD_FILES:-200}
      CHROME_PATH: ${CHROME_PATH:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_IMAGE_MODEL: ${OPENAI_IMAGE_MODEL:-gpt-image-1.5}
    ports:
      - "8090:8090"
    volumes:
      - ./data:/data

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8090}
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8090}
    depends_on:
      - api
    ports:
      - "3000:3000"
